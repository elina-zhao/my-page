<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Advanced Options — Podbean Pro</title>
<style>
  :root{
    --navy:#12283E;
    --navy-soft:#17324D;
    --text:#1E2833;
    --text-2:#39434F;
    --muted:#77818F;
    --line:#E6E9ED;
    --line-soft:#EEF0F3;
    --bg:#F4F6F8;
    --green:#12A67C;
    --sidebar-w:258px;
    --topbar-h:82px;
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue","PingFang SC","Hiragino Sans GB",Arial,sans-serif;
    font-size:15px;
    color:var(--text);
    background:var(--bg);
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    display:flex;
    flex-direction:column;
  }
  a{color:inherit;text-decoration:none}
  button{font-family:inherit}

  /* ---------------- top bar ---------------- */
  .topbar{
    flex:0 0 var(--topbar-h);
    height:var(--topbar-h);
    background:var(--navy);
    display:flex;
    align-items:center;
    padding:0 26px;
    gap:30px;
    position:relative;
    z-index:20;
  }
  .brand{
    position:relative;
    display:flex;
    align-items:baseline;
    color:#fff;
    font-size:26px;
    font-weight:700;
    letter-spacing:-.7px;
    line-height:1;
    padding-top:4px;
    user-select:none;
  }
  .brand-pro{
    font-size:21px;
    font-style:italic;
    font-weight:600;
    margin-left:3px;
    letter-spacing:-.3px;
  }
  .brand-arc{
    position:absolute;
    left:1px;
    top:-6px;
    width:27px;
    height:13px;
    border:2.5px solid #fff;
    border-bottom:0;
    border-radius:30px 30px 0 0;
  }
  .topnav{display:flex;align-items:center;gap:10px}
  .topnav a{
    display:block;
    padding:5px 11px 6px;
    border:1px solid rgba(150,190,226,.75);
    border-radius:3px;
    color:#fff;
    font-size:15px;
    letter-spacing:.1px;
    background:rgba(255,255,255,.04);
  }
  .top-actions{
    margin-left:auto;
    display:flex;
    align-items:center;
    gap:34px;
  }
  .top-action{
    display:inline-flex;
    align-items:center;
    gap:9px;
    color:#fff;
    font-size:15px;
    background:none;
    border:0;
    padding:0;
    cursor:pointer;
    opacity:.96;
  }
  .top-action:hover{opacity:1}
  .top-action .ic{width:18px;height:18px;display:block}
  .top-action .caret{width:11px;height:11px;margin-left:2px;opacity:.85}

  /* ---------------- layout ---------------- */
  .layout{flex:1;display:flex;min-height:0}

  /* sidebar */
  .sidebar{
    flex:0 0 var(--sidebar-w);
    width:var(--sidebar-w);
    background:#fff;
    border-right:1px solid #E9ECEF;
    padding:10px 0 40px;
    overflow-y:auto;
  }
  .nav-item{
    display:flex;
    align-items:center;
    gap:17px;
    width:100%;
    height:64px;
    padding:0 26px;
    color:var(--text-2);
    font-size:15px;
    background:none;
    border:0;
    text-align:left;
    cursor:pointer;
  }
  .nav-item .ic{
    width:19px;height:19px;flex:0 0 auto;
    color:#2E3946;
  }
  .nav-item:hover{background:#F8F9FA}
  .nav-item .caret{
    margin-left:auto;
    width:11px;height:11px;
    color:#5C6775;
    transition:transform .18s ease;
  }
  .nav-item.is-open{background:#F1F3F6;font-weight:600;color:var(--text)}
  .nav-item.is-open .caret{transform:rotate(180deg)}

  .subnav{overflow:hidden}
  .subnav a{
    display:flex;
    align-items:center;
    height:52px;
    padding-left:62px;
    font-size:15px;
    color:var(--text-2);
  }
  .subnav a:hover{background:#F8F9FA}
  .subnav a.active{
    background:#F1F3F6;
    color:#0F1720;
    font-weight:700;
  }

  /* main column */
  .main{
    flex:1;
    min-width:0;
    display:flex;
    flex-direction:column;
    overflow-y:auto;
  }

  /* tabs */
  .tabbar{
    flex:0 0 auto;
    background:#FAFBFC;
    border-bottom:1px solid var(--line);
    display:flex;
  }
  .tabs{
    display:flex;
    flex:1 1 auto;
    max-width:1200px;
    min-width:0;
  }
  .tab{
    flex:1 1 0;
    min-width:0;
    height:100px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:16px;
    color:var(--muted);
    background:#FAFBFC;
    border:0;
    border-left:1px solid var(--line-soft);
    cursor:pointer;
    transition:background .15s ease,color .15s ease;
  }
  .tab:first-child{border-left:0}
  .tab:hover{color:#4A5563}
  .tab.is-active{
    background:#fff;
    color:#111A24;
    font-weight:600;
  }

  /* page body */
  .page{
    flex:1 1 auto;
    display:flex;
    flex-direction:column;
    padding:26px 26px 0;
  }
  .card{
    background:#fff;
    border:1px solid #EDEFF2;
    flex:1 1 auto;
    min-height:600px;
    display:flex;
    flex-direction:column;
    padding:64px 32px 92px;
  }

  .form{
    width:100%;
    max-width:700px;
    margin:0 auto;
  }
  .row{
    display:flex;
    align-items:center;
    gap:30px;
    margin-bottom:28px;
  }
  .row:last-of-type{margin-bottom:0}
  .row-label{
    flex:0 0 200px;
    display:flex;
    align-items:center;
    justify-content:flex-end;
    gap:9px;
    font-size:15px;
    color:var(--text-2);
    white-space:nowrap;
  }
  .row-control{flex:1;min-width:0}

  .info{
    flex:0 0 auto;
    width:16px;height:16px;
    border-radius:50%;
    background:#BFC7D1;
    color:#fff;
    font-size:10.5px;
    font-weight:700;
    line-height:1;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    cursor:help;
    user-select:none;
  }

  /* select */
  .select{position:relative}
  .select select{
    -webkit-appearance:none;
    appearance:none;
    width:100%;
    height:44px;
    padding:0 34px 0 0;
    border:0;
    border-bottom:1px solid #DCE0E6;
    background:transparent;
    font-family:inherit;
    font-size:15px;
    color:var(--text);
    cursor:pointer;
    border-radius:0;
  }
  .select select:focus{outline:none;border-bottom-color:#93A1B2}
  .select .caret{
    position:absolute;
    right:6px;
    top:50%;
    transform:translateY(-50%);
    width:12px;height:12px;
    color:#9AA4B1;
    pointer-events:none;
  }

  /* checkboxes */
  .checks{display:flex;align-items:center;gap:52px}
  .check{
    display:inline-flex;
    align-items:center;
    gap:10px;
    font-size:15px;
    color:var(--text-2);
    cursor:pointer;
    user-select:none;
    position:relative;
  }
  .check input{
    position:absolute;
    opacity:0;
    width:0;height:0;
  }
  .box{
    width:20px;height:20px;
    border-radius:5px;
    background:var(--green);
    display:inline-flex;
    align-items:center;
    justify-content:center;
    flex:0 0 auto;
    transition:background .12s ease,box-shadow .12s ease;
  }
  .box svg{width:13px;height:13px;display:block;opacity:1;transition:opacity .12s ease}
  .check input:not(:checked) + .box{
    background:#fff;
    box-shadow:inset 0 0 0 1.5px #C8D0D9;
  }
  .check input:not(:checked) + .box svg{opacity:0}
  .check input:focus-visible + .box{
    box-shadow:inset 0 0 0 1.5px #C8D0D9,0 0 0 3px rgba(18,166,124,.25);
  }

  /* action */
  .actions{
    margin-top:auto;
    padding-top:110px;
    display:flex;
    justify-content:center;
  }
  .save{
    min-width:168px;
    height:54px;
    padding:0 42px;
    border:0;
    border-radius:27px;
    background:#13293F;
    color:#fff;
    font-size:16px;
    letter-spacing:.2px;
    cursor:pointer;
    box-shadow:0 2px 6px rgba(19,41,63,.16);
    transition:background .15s ease,transform .06s ease;
  }
  .save:hover{background:#1B3B58}
  .save:active{transform:translateY(1px)}

  /* placeholder panels */
  .panel-empty{
    display:none;
    align-items:center;
    justify-content:center;
    min-height:620px;
    color:#98A2AF;
    font-size:15px;
  }

  /* footer */
  .footer{
    margin:60px 0 0;
    padding:18px 0 26px;
    border-top:1px solid var(--line);
    color:#8B95A3;
    font-size:14px;
  }

  /* toast */
  .toast{
    position:fixed;
    left:50%;
    bottom:38px;
    transform:translate(-50%,14px);
    background:#1D2B3A;
    color:#fff;
    font-size:14px;
    padding:11px 22px;
    border-radius:24px;
    box-shadow:0 8px 24px rgba(16,28,42,.24);
    opacity:0;
    pointer-events:none;
    transition:opacity .22s ease,transform .22s ease;
    z-index:60;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}

  /* accessibility fab (as seen in the reference screenshot) */
  .a11y-fab{
    position:fixed;
    right:26px;
    bottom:44px;
    width:48px;height:48px;
    border-radius:50%;
    border:0;
    background:#2E9E3E;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    box-shadow:0 2px 10px rgba(0,0,0,.22);
    z-index:50;
  }
  .a11y-fab svg{width:26px;height:26px;display:block}
  .a11y-fab:focus-visible{outline:3px solid rgba(46,158,62,.4);outline-offset:3px}

  @media (max-width:900px){
    .brand-arc{display:none}
    .row{flex-direction:column;align-items:flex-start;gap:8px}
    .row-label{flex:0 0 auto;justify-content:flex-start}
    .row-control{width:100%}
  }
</style>
</head>
<body>

  <header class="topbar">
    <div class="brand">
      <span class="brand-arc" aria-hidden="true"></span>
      PodBean<span class="brand-pro">pro</span>
    </div>

    <nav class="topnav">
      <a href="#" aria-current="page">Advanced Options</a>
    </nav>

    <div class="top-actions">
      <a class="top-action" href="#">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
          <circle cx="12" cy="12" r="9.2"/>
          <path d="M9.6 9.3a2.5 2.5 0 1 1 3.3 2.4c-.6.2-.9.8-.9 1.4v.4" stroke-linecap="round"/>
          <circle cx="12" cy="17" r=".9" fill="currentColor" stroke="none"/>
        </svg>
        Support
      </a>

      <button class="top-action" type="button">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
          <circle cx="12" cy="8.2" r="3.9"/>
          <path d="M4.8 20.2c.7-3.5 3.7-5.6 7.2-5.6s6.5 2.1 7.2 5.6" stroke-linecap="round"/>
        </svg>
        PB network
        <svg class="caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true">
          <path d="M5 9l7 7 7-7" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </header>

  <div class="layout">

    <aside class="sidebar" aria-label="Main navigation">
      <a class="nav-item" href="#">
        <svg class="ic" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M11.4 2.6a1 1 0 0 1 1.2 0l8.2 6.4c.4.3.6.7.6 1.2v10.3a1 1 0 0 1-1 1h-5.2a1 1 0 0 1-1-1v-5.2h-4.4v5.2a1 1 0 0 1-1 1H3.6a1 1 0 0 1-1-1V10.2c0-.5.2-.9.6-1.2l8.2-6.4z"/>
        </svg>
        Dashboard
      </a>

      <a class="nav-item" href="#">
        <svg class="ic" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <rect x="3" y="3" width="8" height="8" rx="1.4"/>
          <rect x="13" y="3" width="8" height="8" rx="1.4"/>
          <rect x="3" y="13" width="8" height="8" rx="1.4"/>
          <rect x="13" y="13" width="8" height="8" rx="1.4"/>
        </svg>
        Channels
      </a>

      <button class="nav-item" type="button" aria-expanded="false">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M5 19V13" stroke-linecap="round"/>
          <path d="M12 19V6" stroke-linecap="round"/>
          <path d="M19 19V10" stroke-linecap="round"/>
        </svg>
        Statistics
        <svg class="caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true">
          <path d="M5 9l7 7 7-7" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>

      <button class="nav-item is-open" type="button" id="settingsToggle" aria-expanded="true" aria-controls="settingsSub">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
          <rect x="3.2" y="3.2" width="17.6" height="17.6" rx="4.2"/>
          <circle cx="12" cy="10" r="2.5"/>
          <path d="M7.6 17.6c.9-2 2.5-3 4.4-3s3.5 1 4.4 3" stroke-linecap="round"/>
        </svg>
        Settings
        <svg class="caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true">
          <path d="M5 9l7 7 7-7" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>

      <div class="subnav" id="settingsSub">
        <a href="#">Organization Details</a>
        <a href="#">Team Members</a>
        <a href="#" class="active" aria-current="page">Advanced Options</a>
      </div>
    </aside>

    <main class="main">

      <div class="tabbar">
      <div class="tabs" role="tablist" aria-label="Advanced options sections">
        <button class="tab" type="button" role="tab" aria-selected="false" data-tab="security">Security</button>
        <button class="tab" type="button" role="tab" aria-selected="false" data-tab="app">App</button>
        <button class="tab is-active" type="button" role="tab" aria-selected="true" data-tab="content">Content</button>
        <button class="tab" type="button" role="tab" aria-selected="false" data-tab="ai">AI &amp; Integrations</button>
      </div>
      </div>

      <div class="page">

        <div class="card" id="panel-content" role="tabpanel">
          <div class="form">

            <div class="row">
              <div class="row-label">
                Podcast Comments
                <span class="info" title="Allow listeners to leave comments on your podcast page.">?</span>
              </div>
              <div class="row-control">
                <div class="select">
                  <select aria-label="Podcast Comments">
                    <option value="enable" selected>Enable</option>
                    <option value="disable">Disable</option>
                  </select>
                  <svg class="caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true">
                    <path d="M5 9l7 7 7-7" stroke-linecap="round" stroke-linejoin="round"/>
                  </svg>
                </div>
              </div>
            </div>

            <div class="row">
              <div class="row-label">
                Enable Download
                <span class="info" title="Choose where listeners can download your episodes.">?</span>
              </div>
              <div class="row-control">
                <div class="checks">
                  <label class="check">
                    <input type="checkbox" checked />
                    <span class="box">
                      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" aria-hidden="true">
                        <path d="M5 12.5l4.6 4.6L19 7.5" stroke-linecap="round" stroke-linejoin="round"/>
                      </svg>
                    </span>
                    Web
                  </label>

                  <label class="check">
                    <input type="checkbox" checked />
                    <span class="box">
                      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" aria-hidden="true">
                        <path d="M5 12.5l4.6 4.6L19 7.5" stroke-linecap="round" stroke-linejoin="round"/>
                      </svg>
                    </span>
                    Player
                  </label>

                  <label class="check">
                    <input type="checkbox" checked />
                    <span class="box">
                      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" aria-hidden="true">
                        <path d="M5 12.5l4.6 4.6L19 7.5" stroke-linecap="round" stroke-linejoin="round"/>
                      </svg>
                    </span>
                    App
                  </label>
                </div>
              </div>
            </div>

          </div>

          <div class="actions">
            <button class="save" type="button" id="saveBtn">Save</button>
          </div>
        </div>

        <div class="card panel-empty" id="panel-security" role="tabpanel">Security settings</div>
        <div class="card panel-empty" id="panel-app" role="tabpanel">App settings</div>
        <div class="card panel-empty" id="panel-ai" role="tabpanel">AI &amp; Integrations settings</div>

        <div class="footer">Copyright © Podbean.com 2026. All Rights Reserved.</div>
      </div>
    </main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite">Saved</div>

  <button class="a11y-fab" type="button" aria-label="Accessibility options">
    <svg viewBox="0 0 24 24" fill="#fff" aria-hidden="true">
      <circle cx="12" cy="4.3" r="1.9"/>
      <path d="M12 7.6c-.5 0-1 .1-1.4.3l-4.3 1.8a1 1 0 1 0 .8 1.8L10 10.3v3.4l-2.1 5.7a1 1 0 1 0 1.9.7l1.9-5.1h.6l1.9 5.1a1 1 0 1 0 1.9-.7L14 13.7v-3.4l2.9 1.2a1 1 0 1 0 .8-1.8l-4.3-1.8c-.4-.2-.9-.3-1.4-.3z"/>
    </svg>
  </button>

<script>
  // tabs
  const tabs = document.querySelectorAll('.tab');
  tabs.forEach(tab => {
    tab.addEventListener('click', () => {
      tabs.forEach(t => {
        t.classList.remove('is-active');
        t.setAttribute('aria-selected', 'false');
      });
      tab.classList.add('is-active');
      tab.setAttribute('aria-selected', 'true');

      document.querySelectorAll('.card').forEach(p => p.style.display = 'none');
      const panel = document.getElementById('panel-' + tab.dataset.tab);
      if (panel) panel.style.display = 'flex';
    });
  });

  // sidebar settings group
  const settingsToggle = document.getElementById('settingsToggle');
  const settingsSub = document.getElementById('settingsSub');
  settingsToggle.addEventListener('click', () => {
    const open = settingsToggle.classList.toggle('is-open');
    settingsToggle.setAttribute('aria-expanded', String(open));
    settingsSub.hidden = !open;
  });

  // save
  const toast = document.getElementById('toast');
  let toastTimer;
  document.getElementById('saveBtn').addEventListener('click', () => {
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 1800);
  });
</script>
</body>
</html>
