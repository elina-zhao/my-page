<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Podbean — AI Onboarding</title>
<style>
/* ====== Podbean Brand Colors ====== */
:root {
  --p-green: #8FC31F;
  --p-green-dark: #428200;
  --p-green-light: #A8D84D;
  --p-green-bg: #F4F9EA;
  --p-green-subtle: #EAF3D6;
  --p-border: #E5E7EB;
  --p-text: #1C1D21;
  --p-text-secondary: #6B7280;
  --p-text-light: #9CA3AF;
  --p-bg: #F5F6F7;
  --p-card-bg: #FFFFFF;
  --p-radius: 12px;
  --p-radius-sm: 8px;
  --p-font: "SF Pro Display","Inter",-apple-system,sans-serif;
}

/* ====== Base Reset ====== */
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: var(--p-font);
  background: #fff;
  min-height: 100vh;
  color: var(--p-text);
}

/* ====== Navbar ====== */
.navbar {
  position: absolute;
  top: 0; left: 0; right: 0;
  padding: 24px 32px;
  z-index: 10;
  display: flex;
  align-items: center;
  pointer-events: none;
}
.navbar-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
}
.navbar .brand img {
  height: 36px;
  width: auto;
  display: block;
  pointer-events: auto;
}

/* ====== Main Layout ====== */
.wrap-sign {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
.login-page-new {
  flex: 1;
  position: relative;
  padding: 120px 0 0;
}
.left-top-img,
.right-bottom-img {
  position: absolute;
  pointer-events: none;
  z-index: 0;
}
.left-top-img {
  left: 0;
  top: 0;
}
.left-top-img img {
  width: auto;
  max-width: 30vw;
  height: 240px;
}
.right-bottom-img {
  right: 0;
  bottom: 0;
}
.right-bottom-img img {
  width: 280px;
  max-width: 30vw;
  height: auto;
}
.container {
  max-width: 780px;
  margin: 0 auto;
  padding: 0 20px;
  position: relative;
  z-index: 1;
}

/* ====== Onboarding Embed Area ====== */
.www-login-page {
  display: flex;
  justify-content: center;
}

/* ====== Footer ====== */
.footer {
  background: #fff;
  padding: 16px 24px;
  position: relative;
}
.footer .container {
  max-width: 1200px;
}
.footer ul {
  list-style: none;
  display: flex;
  flex-wrap: wrap;
  gap: 8px 20px;
  align-items: center;
  justify-content: center;
}
.footer ul li a {
  color: var(--p-text-secondary);
  font-size: 13px;
  text-decoration: none;
  transition: color 0.2s;
}
.footer ul li a:hover {
  color: var(--p-green-dark);
}
.footer .copy-right {
  color: var(--p-text-light);
  font-size: 12px;
}

/* ================================================
   ONBOARDING DEMO STYLES (scoped .podbean-ai-section)
   ================================================ */
.podbean-ai-section * { margin: 0; padding: 0; box-sizing: border-box; }
.podbean-ai-section {
  font-family: var(--p-font);
  color: var(--p-text);
  display: flex;
  justify-content: center;
  width: 100%;
}
.podbean-ai-section .phone-frame {
  width: 787px;
  max-width: 100%;
  background: var(--p-card-bg);
  border-radius: 16px;
  box-shadow: 0 4px 24px rgba(0,0,0,0.08), 0 1px 3px rgba(0,0,0,0.04);
  overflow: hidden;
  position: relative;
}
.podbean-ai-section .setup-mode { display: block; }
.podbean-ai-section .setup-header {
  background: var(--p-green);
  padding: 14px 16px 12px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.podbean-ai-section .setup-header .back-icon {
  width: 28px; height: 28px;
  background: rgba(255,255,255,0.15);
  border-radius: 7px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: background 0.2s;
}
.podbean-ai-section .setup-header .back-icon:hover { background: rgba(255,255,255,0.25); }
.podbean-ai-section .setup-header .back-icon svg { width: 16px; height: 16px; fill: none; stroke: white; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
.podbean-ai-section .setup-header .brand { display: flex; align-items: center; gap: 10px; flex: 1; }
.podbean-ai-section .setup-header .brand-icon {
  width: 24px; height: 24px;
  background: rgba(255,255,255,0.2);
  border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  font-weight: 800; font-size: 12px; color: white;
}
.podbean-ai-section .setup-header .brand-text { font-weight: 700; font-size: 15px; color: white; letter-spacing: -0.2px; }
.podbean-ai-section .setup-header .brand-dot { width: 3px; height: 3px; background: rgba(255,255,255,0.4); border-radius: 50%; }
.podbean-ai-section .setup-header .brand-sub { font-size: 11px; color: rgba(255,255,255,0.7); font-weight: 500; }
.podbean-ai-section .skip-link {
  font-size: 14px; color: white; text-decoration: none; cursor: pointer;
  padding: 7px 16px; border-radius: 8px; font-weight: 600; white-space: nowrap;
  border: 1.5px solid rgba(255,255,255,0.8); letter-spacing: 0.4px;
  transition: all 0.25s ease;
  animation: pSkipPulse 2.5s ease-in-out infinite;
}
@keyframes pSkipPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(255,255,255,0.35); }
  50% { box-shadow: 0 0 0 8px rgba(255,255,255,0); }
}
.podbean-ai-section .skip-link:hover { color: var(--p-green-dark); background: white; border-color: white; animation: none; }
.podbean-ai-section .skip-link.skip-disabled { opacity: 0.3; pointer-events: none; animation: none; }
.podbean-ai-section .progress-bar { position: absolute; top: 0; left: 0; right: 0; height: 3px; background: rgba(255,255,255,0.15); }
.podbean-ai-section .progress-fill { height: 100%; background: white; transition: width 0.5s ease; border-radius: 0 2px 2px 0; }
.podbean-ai-section .chat-area {
  max-height: 560px; overflow-y: auto; padding: 20px 16px 0;
  scroll-behavior: smooth; background: var(--p-card-bg);
}
.podbean-ai-section .chat-area::-webkit-scrollbar { width: 4px; }
.podbean-ai-section .chat-area::-webkit-scrollbar-thumb { background: var(--p-border); border-radius: 4px; }
.podbean-ai-section .msg { margin-bottom: 16px; opacity: 0; transform: translateY(12px); animation: pMsgIn 0.4s ease forwards; }
@keyframes pMsgIn { to { opacity: 1; transform: translateY(0); } }
.podbean-ai-section .msg-bot { display: flex; gap: 10px; align-items: flex-start; }
.podbean-ai-section .msg-bot .avatar {
  width: 32px; height: 32px; min-width: 32px; background: var(--p-green); border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; color: white; font-weight: 700;
}
.podbean-ai-section .msg-bot .bubble {
  background: var(--p-green-bg); border-radius: 4px 16px 16px 16px;
  padding: 12px 16px; font-size: 14px; line-height: 1.6; color: var(--p-text); max-width: 85%;
}
.podbean-ai-section .msg-bot .bubble strong { color: var(--p-green-dark); }
.podbean-ai-section .msg-user { display: flex; justify-content: flex-end; }
.podbean-ai-section .msg-user .bubble {
  background: var(--p-green); color: white; border-radius: 16px 4px 16px 16px;
  padding: 10px 16px; font-size: 14px; line-height: 1.5; max-width: 78%;
}
.podbean-ai-section .msg-typing { display: flex; gap: 10px; align-items: center; }
.podbean-ai-section .msg-typing .avatar {
  width: 32px; height: 32px; min-width: 32px; background: var(--p-green); border-radius: 50%;
  display: flex; align-items: center; justify-content: center; font-size: 14px; color: white; font-weight: 700;
}
.podbean-ai-section .typing-dots { display: flex; gap: 5px; padding: 12px 16px; background: var(--p-green-bg); border-radius: 16px; }
.podbean-ai-section .typing-dots span { width: 8px; height: 8px; border-radius: 50%; background: var(--p-text-light); animation: pDotBounce 1.2s infinite; }
.podbean-ai-section .typing-dots span:nth-child(2) { animation-delay: 0.15s; }
.podbean-ai-section .typing-dots span:nth-child(3) { animation-delay: 0.3s; }
@keyframes pDotBounce { 0%,60%,100% { transform: translateY(0); } 30% { transform: translateY(-6px); } }
.podbean-ai-section .input-area { padding: 12px 16px 16px; border-top: 1px solid var(--p-border); background: var(--p-card-bg); }
.podbean-ai-section .text-input-wrap {
  display: flex; gap: 8px; align-items: center;
  background: var(--p-bg); border: 1px solid var(--p-border);
  border-radius: 10px; padding: 5px 5px 5px 14px; transition: border-color 0.2s;
}
.podbean-ai-section .text-input-wrap:focus-within { border-color: var(--p-green); }
.podbean-ai-section .text-input-wrap input {
  flex: 1; border: none; outline: none; font-size: 14px; font-family: var(--p-font);
  background: transparent; color: var(--p-text); padding: 6px 0;
}
.podbean-ai-section .text-input-wrap input::placeholder { color: var(--p-text-light); }
.podbean-ai-section .text-input-wrap button {
  width: 34px; height: 34px; background: var(--p-green); border: none; border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: background 0.2s; color: white;
}
.podbean-ai-section .text-input-wrap button:hover { background: var(--p-green-dark); }
.podbean-ai-section .text-input-wrap button:disabled { background: var(--p-border); cursor: not-allowed; }
.podbean-ai-section .text-input-wrap button svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
.podbean-ai-section .choices { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; opacity: 0; transform: translateY(8px); animation: pMsgIn 0.35s ease 0.2s forwards; }
.podbean-ai-section .choice-btn {
  padding: 10px 18px; border: 1.5px solid var(--p-border); border-radius: 10px;
  background: var(--p-card-bg); font-size: 14px; font-family: var(--p-font); color: var(--p-text);
  cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 6px;
}
.podbean-ai-section .choice-btn:hover { border-color: var(--p-green); color: var(--p-green-dark); background: var(--p-green-bg); }
.podbean-ai-section .choice-btn.selected { border-color: var(--p-green); background: var(--p-green-bg); color: var(--p-green-dark); font-weight: 500; }
.podbean-ai-section .card-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
.podbean-ai-section .card-item {
  padding: 12px 14px; border: 1.5px solid var(--p-border); border-radius: var(--p-radius-sm);
  cursor: pointer; transition: all 0.2s; font-size: 13px; text-align: center;
  background: var(--p-card-bg); display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative;
}
.podbean-ai-section .card-item .cat-emoji { font-size: 22px; }
.podbean-ai-section .card-item .cat-label { font-weight: 500; }
.podbean-ai-section .card-item:hover:not(.recommended) { border-color: var(--p-green); background: var(--p-green-bg); }
.podbean-ai-section .card-item.selected { border-color: var(--p-green); background: var(--p-green-bg); box-shadow: 0 0 0 2px rgba(143,195,31,0.15); }
.podbean-ai-section .card-item.recommended {
  border-color: var(--p-green); background: linear-gradient(135deg, var(--p-green-bg) 0%, #FFF 100%);
  box-shadow: 0 2px 12px rgba(143,195,31,0.10);
}
.podbean-ai-section .card-item.recommended::after {
  content: "Recommended"; position: absolute; top: -6px; right: -6px;
  background: var(--p-green); color: white; font-size: 9px; font-weight: 700;
  letter-spacing: 0.3px; padding: 2px 8px; border-radius: 20px; text-transform: uppercase;
}
.podbean-ai-section .card-item.recommended .cat-label::after { content: " \2605"; color: var(--p-green); font-weight: 700; }
.podbean-ai-section .result-card { background: var(--p-card-bg); border: 1px solid var(--p-border); border-radius: var(--p-radius); padding: 18px; margin-top: 14px; }
.podbean-ai-section .result-card h4 { font-size: 14px; font-weight: 600; margin-bottom: 6px; }
.podbean-ai-section .result-card p { font-size: 13px; color: var(--p-text-secondary); line-height: 1.5; }
.podbean-ai-section .suggestion-group { margin-top: 14px; }
.podbean-ai-section .suggestion-group h4 { font-size: 13px; font-weight: 600; margin-bottom: 8px; color: var(--p-text-secondary); text-transform: uppercase; letter-spacing: 0.5px; }
.podbean-ai-section .title-cards { display: flex; flex-direction: column; gap: 8px; }
.podbean-ai-section .title-card {
  display: flex; align-items: center; gap: 12px; padding: 12px 14px;
  border: 1.5px solid var(--p-border); border-radius: var(--p-radius-sm);
  cursor: pointer; transition: all 0.2s; background: var(--p-card-bg);
}
.podbean-ai-section .title-card:hover { border-color: var(--p-green); background: var(--p-green-bg); }
.podbean-ai-section .title-card.selected { border-color: var(--p-green); background: var(--p-green-bg); }
.podbean-ai-section .title-card .t-num { width: 24px; height: 24px; min-width: 24px; border-radius: 50%; background: var(--p-border); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; color: var(--p-text-secondary); }
.podbean-ai-section .title-card.selected .t-num { background: var(--p-green); color: white; }
.podbean-ai-section .title-card .t-text { font-size: 14px; font-weight: 500; }
.podbean-ai-section .logo-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-top: 8px; }
.podbean-ai-section .logo-card { aspect-ratio: 1; border-radius: var(--p-radius-sm); border: 2px solid var(--p-border); cursor: pointer; transition: all 0.2s; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 12px; color: var(--p-text-secondary); gap: 6px; background: var(--p-bg); overflow: hidden; }
.podbean-ai-section .logo-card:hover { border-color: var(--p-green); }
.podbean-ai-section .logo-card.selected { border-color: var(--p-green); box-shadow: 0 0 0 2px rgba(143,195,31,0.15); }
.podbean-ai-section .logo-card .logo-preview { width: 52px; height: 52px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 26px; }
.podbean-ai-section .logo-card .logo-label { font-weight: 500; }
.podbean-ai-section .action-row { display: flex; gap: 10px; margin-top: 16px; }
.podbean-ai-section .btn-primary {
  padding: 10px 24px; background: var(--p-green); color: white; border: none; border-radius: 8px;
  font-size: 14px; font-weight: 600; font-family: var(--p-font); cursor: pointer; transition: all 0.2s; white-space: nowrap;
}
.podbean-ai-section .btn-primary:hover { background: var(--p-green-dark); transform: translateY(-1px); }
.podbean-ai-section .btn-ghost {
  padding: 10px 24px; background: transparent; color: var(--p-text-secondary);
  border: 1px solid var(--p-border); border-radius: 8px; font-size: 14px; font-weight: 500;
  font-family: var(--p-font); cursor: pointer; transition: all 0.2s; white-space: nowrap;
}
.podbean-ai-section .btn-ghost:hover { background: var(--p-bg); color: var(--p-text); }
.podbean-ai-section .dash-mode { display: none; }
.podbean-ai-section .dash-mode.active { display: flex; flex-direction: column; }
.podbean-ai-section .dash-topbar {
  height: 52px; background: var(--p-card-bg); border-bottom: 1px solid var(--p-border);
  display: flex; align-items: center; padding: 0 16px; gap: 12px; flex-shrink: 0;
}
.podbean-ai-section .dash-topbar .logo-area { display: flex; align-items: center; gap: 8px; }
.podbean-ai-section .dash-topbar .logo-icon { width: 28px; height: 28px; background: var(--p-green); border-radius: 6px; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 13px; color: white; }
.podbean-ai-section .dash-topbar .logo-text { font-weight: 700; font-size: 15px; color: var(--p-text); }
.podbean-ai-section .dash-topbar .top-spacer { flex: 1; }
.podbean-ai-section .dash-body { display: flex; flex: 1; overflow: hidden; }
.podbean-ai-section .dash-sidebar {
  width: 200px; background: var(--p-card-bg); border-right: 1px solid var(--p-border);
  padding: 12px 10px; display: flex; flex-direction: column; gap: 2px; flex-shrink: 0;
}
.podbean-ai-section .dash-sidebar .nav-item {
  display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 8px;
  font-size: 13px; font-weight: 500; color: var(--p-text-secondary); cursor: pointer; transition: all 0.15s;
}
.podbean-ai-section .dash-sidebar .nav-item:hover { background: var(--p-bg); color: var(--p-text); }
.podbean-ai-section .dash-sidebar .nav-item.active { background: var(--p-green-bg); color: var(--p-green-dark); font-weight: 600; }
.podbean-ai-section .dash-sidebar .nav-item .nav-icon { font-size: 16px; width: 20px; text-align: center; }
.podbean-ai-section .dash-sidebar .nav-divider { height: 1px; background: var(--p-border); margin: 8px 12px; }
.podbean-ai-section .dash-content { flex: 1; padding: 20px 24px; overflow-y: auto; background: var(--p-bg); }
.podbean-ai-section .dash-content .page-title { font-size: 18px; font-weight: 700; margin-bottom: 16px; }
.podbean-ai-section .widget-card { background: var(--p-card-bg); border: 1px solid var(--p-border); border-radius: var(--p-radius); overflow: hidden; margin-bottom: 16px; }
.podbean-ai-section .widget-card .widget-header { padding: 14px 18px 0; display: flex; align-items: center; justify-content: space-between; }
.podbean-ai-section .widget-card .widget-header h3 { font-size: 14px; font-weight: 600; }
.podbean-ai-section .widget-card .widget-body { padding: 12px 18px 18px; }
.podbean-ai-section .podcast-summary { display: flex; align-items: center; gap: 14px; }
.podbean-ai-section .podcast-summary .ps-thumb { width: 56px; height: 56px; min-width: 56px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 26px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
.podbean-ai-section .podcast-summary .ps-info { flex: 1; min-width: 0; }
.podbean-ai-section .podcast-summary .ps-info h4 { font-size: 15px; font-weight: 600; margin-bottom: 2px; }
.podbean-ai-section .podcast-summary .ps-info .ps-meta { font-size: 12px; color: var(--p-text-light); }
.podbean-ai-section .podcast-summary .ps-badge { font-size: 10px; font-weight: 700; text-transform: uppercase; padding: 3px 10px; border-radius: 20px; background: var(--p-green-bg); color: var(--p-green-dark); white-space: nowrap; }
.podbean-ai-section .stats-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
.podbean-ai-section .stat-box { text-align: center; padding: 8px 0; }
.podbean-ai-section .stat-box .stat-num { font-size: 22px; font-weight: 700; color: var(--p-text); }
.podbean-ai-section .stat-box .stat-label { font-size: 12px; color: var(--p-text-light); margin-top: 2px; }
.podbean-ai-section .guide-steps-list { display: flex; flex-direction: column; gap: 6px; }
.podbean-ai-section .guide-step-row { display: flex; align-items: center; gap: 12px; padding: 8px 10px; border-radius: 8px; }
.podbean-ai-section .guide-step-row .gs-dot { width: 24px; height: 24px; min-width: 24px; border-radius: 50%; border: 2px solid var(--p-border); display: flex; align-items: center; justify-content: center; }
.podbean-ai-section .guide-step-row .gs-dot.done { background: #10B981; border-color: #10B981; }
.podbean-ai-section .guide-step-row .gs-dot.done svg { width: 11px; height: 11px; stroke: white; fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.podbean-ai-section .guide-step-row .gs-dot.current { border-color: var(--p-green); box-shadow: 0 0 0 3px rgba(143,195,31,0.15); }
.podbean-ai-section .guide-step-row .gs-dot.current .gs-inner { width: 8px; height: 8px; border-radius: 50%; background: var(--p-green); }
.podbean-ai-section .guide-step-row .gs-text { font-size: 13px; color: var(--p-text-secondary); }
.podbean-ai-section .guide-step-row .gs-text strong { color: var(--p-text); }
.podbean-ai-section .guide-step-row .gs-text.done-text { color: var(--p-text-light); text-decoration: line-through; }
.podbean-ai-section .guide-progress-row { display: flex; align-items: center; gap: 10px; padding: 0 10px 4px; }
.podbean-ai-section .guide-progress-row .gp-bar { flex: 1; height: 4px; background: var(--p-border); border-radius: 4px; overflow: hidden; }
.podbean-ai-section .guide-progress-row .gp-bar .gp-fill { height: 100%; background: linear-gradient(90deg, var(--p-green), var(--p-green-light)); border-radius: 4px; transition: width 0.6s ease; }
.podbean-ai-section .guide-progress-row .gp-label { font-size: 11px; color: var(--p-text-light); white-space: nowrap; }
.podbean-ai-section .quick-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.podbean-ai-section .qa-btn { display: flex; align-items: center; gap: 10px; padding: 12px 14px; background: var(--p-card-bg); border: 1px solid var(--p-border); border-radius: var(--p-radius-sm); cursor: pointer; transition: all 0.2s; }
.podbean-ai-section .qa-btn:hover { border-color: var(--p-green); background: var(--p-green-bg); }
.podbean-ai-section .qa-btn .qa-icon { font-size: 20px; }
.podbean-ai-section .qa-btn .qa-label { font-size: 13px; font-weight: 500; }
.podbean-ai-section .qa-btn .qa-desc { font-size: 11px; color: var(--p-text-light); }

<script>
(function() {
  var state = {
    step: "welcome", podcastDesc: "", category: "",
    selectedTitle: null, selectedLogo: null, flowCompleted: false
  };
  var progressMap = { welcome:8, choice:20, describe:35, category:50, generating:65, results:82, complete:100 };
  function setProgress(step) {
    var p = progressMap[step] || 10;
    var el = document.getElementById('progressFill');
    if (el) el.style.width = p + '%';
  }
  var chat = document.getElementById('chatArea');
  var inputArea = document.getElementById('inputArea');

  function addTyping(cb) {
    var d = document.createElement('div'); d.className = 'msg msg-typing'; d.id = 'typingIndicator';
    d.innerHTML = '<div class="avatar">AI</div><div class="typing-dots"><span></span><span></span><span></span></div>';
    chat.appendChild(d); chat.scrollTop = chat.scrollHeight;
    setTimeout(function() { var e = document.getElementById('typingIndicator'); if(e)e.remove(); if(cb)cb(); }, 700+Math.random()*500);
  }
  function addBotMsg(h) {
    var d = document.createElement('div'); d.className = 'msg msg-bot';
    d.innerHTML = '<div class="avatar">AI</div><div class="bubble">'+h+'</div>';
    chat.appendChild(d); chat.scrollTop = chat.scrollHeight;
  }
  function addUserMsg(t) {
    var d = document.createElement('div'); d.className = 'msg msg-user';
    d.innerHTML = '<div class="bubble">'+t+'</div>';
    chat.appendChild(d); chat.scrollTop = chat.scrollHeight;
  }
  function addHTML(h) {
    var d = document.createElement('div'); d.innerHTML = h;
    chat.appendChild(d.firstElementChild); chat.scrollTop = chat.scrollHeight;
  }
  function scrollBottom() { setTimeout(function(){ chat.scrollTop = chat.scrollHeight; },50); }
  function clearInput() { inputArea.innerHTML = ''; }

  function showTextInput(pl, onSubmit) {
    inputArea.innerHTML = '<div class="text-input-wrap"><input type="text" id="chatInput" placeholder="'+pl+'" autofocus><button id="sendBtn" onclick="window._pHandleTextSubmit()"><svg><path d="M12 19V5M5 12l7-7 7 7"/></svg></button></div>';
    var inp = document.getElementById('chatInput'); inp.focus();
    inp.addEventListener('keydown',function(e){if(e.key==='Enter')window._pHandleTextSubmit();});
    window._pTextCallback = onSubmit;
  }
  window._pHandleTextSubmit = function() {
    var inp = document.getElementById('chatInput'); var val = inp.value.trim();
    if(!val)return; addUserMsg(val); inp.value='';
    document.getElementById('sendBtn').disabled=true;
    if(window._pTextCallback) window._pTextCallback(val);
  };

  function showChoiceInput(choices, cb) {
    var h = '<div class="choices">';
    for(var i=0;i<choices.length;i++) {
      h += '<button class="choice-btn" onclick="window._pHandleChoice('+i+')">'+(choices[i].emoji?'<span class="emoji">'+choices[i].emoji+'</span>':'')+choices[i].label+'</button>';
    }
    h += '</div>'; inputArea.innerHTML = h;
    window._pChoiceCallback = cb; window._pChoices = choices; scrollBottom();
  }
  window._pHandleChoice = function(idx) {
    var btns = inputArea.querySelectorAll('.choice-btn');
    btns.forEach(function(b){b.classList.remove('selected');b.disabled=true;});
    btns[idx].classList.add('selected');
    addUserMsg(window._pChoices[idx].label);
    if(window._pChoiceCallback) window._pChoiceCallback(idx);
  };

  function showGridCards(items, cb, si) {
    var h = '<div class="card-grid">';
    for(var i=0;i<items.length;i++) {
      var r = i===si;
      h += '<div class="card-item'+(r?' recommended':'')+'" onclick="window._pHandleGridClick('+i+')">'+(items[i].emoji?'<span class="cat-emoji">'+items[i].emoji+'</span>':'')+'<span class="cat-label">'+items[i].label+'</span></div>';
    }
    h += '</div>'; inputArea.innerHTML = h;
    window._pGridItems = items; window._pGridCallback = cb; window._pGridManualSelect = false;
    setTimeout(function(){ handleGridSelect(si); },100); scrollBottom();
  }
  function handleGridSelect(idx) {
    var cards = inputArea.querySelectorAll('.card-item');
    cards.forEach(function(c){c.classList.remove('selected');c.style.pointerEvents='none';});
    cards[idx].classList.add('selected');
    if(window._pGridManualSelect) { addUserMsg(window._pGridItems[idx].label); scrollBottom(); }
    if(window._pGridCallback) window._pGridCallback(idx);
  }
  window._pHandleGridClick = function(idx) { window._pGridManualSelect = true; handleGridSelect(idx); };

  function showActionRow(primary, ghost, primaryCb, ghostCb) {
    var h = '<div class="action-row"><button class="btn-primary" id="actionPrimary">'+primary+'</button>'+(ghost?'<button class="btn-ghost" id="actionGhost">'+ghost+'</button>':'')+'</div>';
    addHTML(h);
    document.getElementById('actionPrimary').addEventListener('click',primaryCb);
    if(ghost) document.getElementById('actionGhost').addEventListener('click',ghostCb);
    scrollBottom();
  }

  function restartDemo() {
    chat.innerHTML = ''; clearInput();
    document.getElementById('skipLink').classList.remove('skip-disabled');
    document.getElementById('setupMode').style.display = 'block';
    document.getElementById('dashMode').classList.remove('active');
    state.step='welcome'; state.podcastDesc=''; state.category=''; state.selectedTitle=null; state.selectedLogo=null; state.flowCompleted=false;
    setProgress('welcome'); startFlow();
  }

  function confirmSkip() {
    if(state.step==='complete') return;
    document.getElementById('skipLink').classList.add('skip-disabled'); clearInput();
    addBotMsg('No problem! You can <strong>skip the AI setup</strong> and configure everything later from the settings panel.'); scrollBottom();
    setTimeout(function(){
      var m = document.createElement('div'); m.className='msg msg-user';
      m.innerHTML='<div class="bubble">Skip to dashboard</div>'; chat.appendChild(m); scrollBottom();
      showActionRow('\ud83d\ude80 Yes, take me to dashboard','\u2b05\ufe0f  Go back',function(){state.flowCompleted=false;enterDashboard();},function(){
        document.getElementById('skipLink').classList.remove('skip-disabled');
        document.querySelectorAll('.msg-user,.action-row,.msg-bot').forEach(function(el){if(el.textContent.includes('Skip')||el.textContent.includes('skip the AI'))el.remove();});
        scrollBottom();
      }); scrollBottom();
    },400);
  }

  function startFlow() {
    addTyping(function(){
      addBotMsg('\ud83d\udc4b Welcome to <strong>Podbean</strong>!<br>I\'m your AI podcast assistant. I\'ll help you get set up in just a few minutes.'); scrollBottom();
      setTimeout(function(){stepChoice();},600);
    });
  }

  function stepChoice() {
    state.step='choice'; setProgress('choice');
    addTyping(function(){
      addBotMsg('Would you like to <strong>start a new podcast</strong>, or <strong>import an existing one</strong>?');
      showChoiceInput([{label:'\ud83c\udf99\ufe0f  Start a New Podcast'},{label:'\ud83d\udce6  Import Existing Podcast'}], function(idx){
        if(idx===0) setTimeout(function(){stepDescribe();},300);
        else {
          addTyping(function(){
            addBotMsg('Got it! Please paste your existing podcast\'s RSS feed link, and I\'ll import everything for you.');
            showTextInput('Paste your RSS feed URL...',function(val){
              addTyping(function(){
                addBotMsg('\u2705 Parsing your RSS feed...<br>Your podcast content has been imported successfully! Let\'s polish up your show info next.'); scrollBottom();
                setTimeout(function(){stepCategory();},600);
              });
            });
          });
        }
        scrollBottom();
      }); scrollBottom();
    });
  }

  function stepDescribe() {
    state.step='describe'; setProgress('describe');
    addTyping(function(){
      addBotMsg('Awesome! \ud83c\udf89<br>Tell me about your podcast — <strong>what\'s it about?</strong><br><span style="color:var(--p-text-light);font-size:13px;">For example: tech startups, late-night storytelling, history deep dives, movie analysis\u2026</span>');
      showTextInput('Describe your podcast...',function(val){state.podcastDesc=val;setTimeout(function(){stepCategory();},300);}); scrollBottom();
    });
  }

  var CATEGORIES = [
    {emoji:'\ud83d\udcbb',label:'Technology'},{emoji:'\ud83d\udcbc',label:'Business'},{emoji:'\ud83d\ude02',label:'Comedy'},
    {emoji:'\ud83c\udf93',label:'Education'},{emoji:'\ud83c\udfb5',label:'Music'},{emoji:'\u2764\ufe0f',label:'Health & Wellness'},
    {emoji:'\ud83d\udcf0',label:'News'},{emoji:'\u26bd',label:'Sports'},{emoji:'\ud83c\udfac',label:'Entertainment'},
    {emoji:'\ud83e\udde0',label:'Society & Culture'},{emoji:'\ud83d\udde3\ufe0f',label:'True Crime'},{emoji:'\ud83d\ude4f',label:'Religion & Spirituality'},
  ];

  function suggestCategory(desc) {
    var d = desc.toLowerCase();
    var rules = [
      {keywords:['tech','software','code','programming','app','startup','ai','computer','digital','data','engineering','product','saas','blockchain','web'],idx:0},
      {keywords:['business','entrepreneur','marketing','finance','invest','money','startup','sales','economy','founder','venture','growth'],idx:1},
      {keywords:['comedy','funny','humor','joke','laugh','satire','standup','comedian','sketch','improv'],idx:2},
      {keywords:['education','learn','teach','science','history','math','school','study','knowledge','research','academic','course','lesson'],idx:3},
      {keywords:['music','song','band','album','concert','guitar','artist','singer','rap','hip hop','jazz','rock','pop','classical'],idx:4},
      {keywords:['health','wellness','fitness','mental','meditation','yoga','nutrition','diet','exercise','therapy','mindfulness','sleep'],idx:5},
      {keywords:['news','current event','politics','world','report','journalism','media','breaking','daily','update','headline','press'],idx:6},
      {keywords:['sport','football','soccer','basketball','game','athlete','baseball','fitness','training','nfl','nba','workout','team'],idx:7},
      {keywords:['movie','film','tv','entertainment','hollywood','celebrity','gaming','game','review','pop culture','cinema','series','anime'],idx:8},
      {keywords:['society','culture','social','life','storytelling','story','people','community','identity','gender','race','philosophy','relationship'],idx:9},
      {keywords:['crime','true crime','murder','mystery','detective','investigation','court','case','criminal','forensic','serial','unsolved'],idx:10},
      {keywords:['religion','spiritual','faith','god','bible','meditation','prayer','soul','belief','christian','buddhist','muslim','consciousness'],idx:11},
    ];
    var scores = new Array(CATEGORIES.length).fill(0);
    for(var ri=0;ri<rules.length;ri++) for(var ki=0;ki<rules[ri].keywords.length;ki++) if(d.indexOf(rules[ri].keywords[ki])!==-1) scores[rules[ri].idx]+=1;
    var max = Math.max.apply(null,scores);
    return max===0?9:scores.indexOf(max);
  }

  function stepCategory() {
    state.step='category'; setProgress('category');
    var si = suggestCategory(state.podcastDesc); var sn = CATEGORIES[si].label;
    addTyping(function(){
      addBotMsg('Based on your description, I recommend the <strong>'+sn+'</strong> category. Does that fit, or would you like to pick something else?');
      window._pGridManualSelect = false;
      showGridCards(CATEGORIES,function(idx){state.category=CATEGORIES[idx].label;setTimeout(function(){stepGenerating();},300);},si); scrollBottom();
    });
  }

  function stepGenerating() {
    state.step='generating'; setProgress('generating'); clearInput();
    addTyping(function(){
      addBotMsg('Great! Let me analyze your input and generate some recommendations \ud83c\udfa8'); scrollBottom();
      addTyping(function(){
        addBotMsg('Analyzing your topic <strong>"'+state.podcastDesc+'"</strong>, combined with trending patterns in <strong>'+state.category+'</strong>\u2026'); scrollBottom();
        addTyping(function(){
          addBotMsg('Here\'s what I\'ve put together for you! \ud83d\udc47'); scrollBottom();
          setTimeout(function(){stepResults();},400);
        });
      });
    });
  }

  function catTitles(cat, off) {
    var m = {
      'Technology':['The Debug Log','Pixel & Circuit','Code & Coffee'], 'Business':['Startup Insider','The Growth Playbook','Money Matters'],
      'Comedy':['Laugh Track','Punchline','The Funny Bone'], 'Education':['Mind Expansion','The Learning Curve','Curious Minds'],
      'Music':['Sound Waves','The Amplifier','Ear Candy'], 'Health & Wellness':['The Balanced Life','Wellness Lab','Mind Body Spirit'],
      'News':['The Daily Brief','News Unpacked','Headlines & Beyond'], 'Sports':['The Final Score','Game Day','Sideline Stories'],
      'Entertainment':['The Spotlight','Screen & Stage','Pop Culture Fix'], 'Society & Culture':['The Human Tapestry','Culture Lab','Open Dialogue'],
      'True Crime':['Case File','The Evidence Room','Mystery Unsolved'], 'Religion & Spirituality':['The Inner Path','Sacred Space','Soulful Living'],
    };
    return (m[cat] || ['The Podcast Lab','Audio Stories','The Frequency'])[off % 3];
  }

  function generateTitle(idx) { return [catTitles(state.category,0),catTitles(state.category,1),catTitles(state.category,2)][idx]||'My Podcast'; }
  function generateDescription() { var d = state.podcastDesc||'everything interesting under the sun'; return 'A podcast that dives deep into '+d+'. Each episode brings fresh insights, compelling stories, and practical takeaways \u2014 whether you\'re a seasoned enthusiast or just getting started, there\'s something here for you.'; }

  function stepResults() {
    state.step='results'; setProgress('results'); clearInput();
    var logos = [{label:'Minimal',bg:'linear-gradient(135deg,#8FC31F,#A8D84D)',icon:'\ud83c\udf99\ufe0f'},{label:'Energetic',bg:'linear-gradient(135deg,#F59E0B,#EF4444)',icon:'\u26a1'},{label:'Deep',bg:'linear-gradient(135deg,#1E293B,#475569)',icon:'\ud83c\udf0c'}];
    var tlHtml=''; for(var i=0;i<3;i++) tlHtml+='<div class="title-card" onclick="window._pSelectTitle('+i+')"><div class="t-num">'+(i+1)+'</div><div class="t-text">'+generateTitle(i)+'</div></div>';
    var logoHtml=''; for(var li=0;li<logos.length;li++) logoHtml+='<div class="logo-card" onclick="window._pSelectLogo('+li+')"><div class="logo-preview" style="background:'+logos[li].bg+';">'+logos[li].icon+'</div><div class="logo-label">'+logos[li].label+'</div></div>';
    addHTML('<div class="result-card"><h4>\ud83c\udfaf Recommended Titles</h4><div class="title-cards">'+tlHtml+'</div><div class="suggestion-group" style="margin-top:18px;"><h4>\ud83d\udcdd Recommended Description</h4><p style="font-size:13px;color:var(--p-text-secondary);line-height:1.6;background:var(--p-bg);padding:12px 14px;border-radius:8px;">'+generateDescription()+'</p></div><div class="suggestion-group" style="margin-top:16px;"><h4>\ud83c\udfa8 Cover Art Style</h4><div class="logo-grid">'+logoHtml+'</div></div></div>');
    setTimeout(function(){window._pSelectTitle(0);window._pSelectLogo(0);},100);
    showActionRow('\u2705 Looks Good, Start!','\ud83d\udd04 Regenerate All',function(){state.flowCompleted=true;enterDashboard();},function(){
      addBotMsg('No problem, let me generate a fresh set of options for you \ud83d\udd04');scrollBottom();
      var rc = document.querySelector('.result-card'); if(rc)rc.remove();
      var ar = document.querySelector('.action-row'); if(ar)ar.remove();
      setTimeout(function(){stepGenerating();},600);
    }); scrollBottom();
  }

  window._pSelectTitle = function(idx){state.selectedTitle=idx;document.querySelectorAll('.title-card').forEach(function(e,i){e.classList.toggle('selected',i===idx);});};
  window._pSelectLogo = function(idx){state.selectedLogo=idx;document.querySelectorAll('.logo-card').forEach(function(e,i){e.classList.toggle('selected',i===idx);});};

  function enterDashboard() {
    state.step='complete'; setProgress('complete');
    document.getElementById('setupMode').style.display='none';
    document.getElementById('dashMode').classList.add('active');
    renderDashboard();
  }

  function renderDashboard() {
    var c = document.getElementById('dashContent');
    c.innerHTML = state.flowCompleted ? buildCompletedDashboard() : buildSkippedDashboard();
  }

  function buildCompletedDashboard() {
    var logos=[{bg:'linear-gradient(135deg,#8FC31F,#A8D84D)',icon:'\ud83c\udf99\ufe0f'},{bg:'linear-gradient(135deg,#F59E0B,#EF4444)',icon:'\u26a1'},{bg:'linear-gradient(135deg,#1E293B,#475569)',icon:'\ud83c\udf0c'}];
    var l=logos[state.selectedLogo||0]; var t=generateTitle(state.selectedTitle||0);
    var d=(state.podcastDesc||'').substring(0,30)+((state.podcastDesc||'').length>30?'\u2026':'');
    return '<h2 class="page-title">Dashboard</h2>'+
      '<div class="widget-card"><div class="widget-body"><div class="podcast-summary"><div class="ps-thumb" style="background:'+l.bg+';">'+l.icon+'</div><div class="ps-info"><h4>'+t+'</h4><div class="ps-meta">'+(state.category||'Podcast')+' \u00b7 '+d+'</div></div><span class="ps-badge">AI Generated</span></div></div></div>'+
      '<div class="widget-card"><div class="widget-body"><div class="stats-grid"><div class="stat-box"><div class="stat-num">0</div><div class="stat-label">Episodes</div></div><div class="stat-box"><div class="stat-num">\u2014</div><div class="stat-label">Total Listens</div></div><div class="stat-box"><div class="stat-num">\u2014</div><div class="stat-label">Subscribers</div></div></div></div></div>'+
      '<div class="widget-card"><div class="widget-header"><h3>\ud83d\ude80 Getting Started Guide</h3><span class="widget-action" style="font-size:12px;color:var(--p-green-dark);cursor:pointer;font-weight:500;" onclick="window._pRestartDemo()">Re-run AI Setup \u2192</span></div><div class="widget-body"><div class="guide-progress-row"><div class="gp-bar"><div class="gp-fill" style="width:20%"></div></div><span class="gp-label">1 / 5</span></div><div class="guide-steps-list">'+
      '<div class="guide-step-row"><div class="gs-dot done"><svg><path d="M5 13l4 4L19 7"/></svg></div><span class="gs-text done-text"><strong>AI Setup</strong> \u2014 podcast created</span></div>'+
      '<div class="guide-step-row"><div class="gs-dot current"><div class="gs-inner"></div></div><span class="gs-text"><strong>First Episode</strong> \u2014 record or upload</span></div>'+
      '<div class="guide-step-row"><div class="gs-dot"></div><span class="gs-text"><strong>Distribution</strong> \u2014 submit to Apple/Spotify</span></div>'+
      '<div class="guide-step-row"><div class="gs-dot"></div><span class="gs-text"><strong>Website</strong> \u2014 set up your podcast site</span></div>'+
      '<div class="guide-step-row"><div class="gs-dot"></div><span class="gs-text"><strong>Analytics</strong> \u2014 track listener data</span></div></div></div></div>'+
      '<div class="widget-card"><div class="widget-header"><h3>\u26a1 Quick Actions</h3></div><div class="widget-body"><div class="quick-actions">'+
      '<div class="qa-btn"><span class="qa-icon">\ud83c\udfa4</span><div><div class="qa-label">New Episode</div><div class="qa-desc">Record or upload audio</div></div></div>'+
      '<div class="qa-btn"><span class="qa-icon">\ud83d\udce1</span><div><div class="qa-label">Distribute</div><div class="qa-desc">Submit to directories</div></div></div>'+
      '<div class="qa-btn"><span class="qa-icon">\ud83c\udfa8</span><div><div class="qa-label">Customize</div><div class="qa-desc">Edit show info</div></div></div>'+
      '<div class="qa-btn"><span class="qa-icon">\ud83d\udcca</span><div><div class="qa-label">Analytics</div><div class="qa-desc">View listener data</div></div></div></div></div></div>';
  }

  function buildSkippedDashboard() {
    return '<h2 class="page-title">Dashboard</h2>'+
      '<div class="widget-card"><div class="widget-body"><div class="empty-state"><div class="empty-icon">\ud83c\udf99\ufe0f</div><h3>Welcome to Podbean!</h3><p>You haven\'t set up your show yet. Use AI Setup to auto-generate your podcast title, description, and cover art \u2014 or configure everything manually.</p><button class="btn-primary" onclick="window._pRestartDemo()">\ud83c\udfaf Try AI Setup</button></div></div></div>'+
      '<div class="widget-card"><div class="widget-header"><h3>\ud83d\ude80 Getting Started Guide</h3></div><div class="widget-body"><div class="guide-progress-row"><div class="gp-bar"><div class="gp-fill" style="width:0%"></div></div><span class="gp-label">0 / 5</span></div><div class="guide-steps-list">'+
      '<div class="guide-step-row"><div class="gs-dot current"><div class="gs-inner"></div></div><span class="gs-text"><strong>\ud83c\udf99\ufe0f AI Setup</strong> \u2014 auto-generate title, description & cover</span></div>'+
      '<div class="guide-step-row"><div class="gs-dot"></div><span class="gs-text"><strong>First Episode</strong> \u2014 record or upload</span></div>'+
      '<div class="guide-step-row"><div class="gs-dot"></div><span class="gs-text"><strong>Distribution</strong> \u2014 submit to Apple/Spotify</span></div>'+
      '<div class="guide-step-row"><div class="gs-dot"></div><span class="gs-text"><strong>Website</strong> \u2014 set up your podcast site</span></div>'+
      '<div class="guide-step-row"><div class="gs-dot"></div><span class="gs-text"><strong>Analytics</strong> \u2014 track listener data</span></div></div></div></div>'+
      '<div class="widget-card"><div class="widget-header"><h3>\u26a1 Quick Actions</h3></div><div class="widget-body"><div class="quick-actions">'+
      '<div class="qa-btn" onclick="window._pRestartDemo()"><span class="qa-icon">\ud83c\udfaf</span><div><div class="qa-label">AI Setup</div><div class="qa-desc">Auto-generate show info</div></div></div>'+
      '<div class="qa-btn"><span class="qa-icon">\ud83c\udfa4</span><div><div class="qa-label">New Episode</div><div class="qa-desc">Record or upload audio</div></div></div>'+
      '<div class="qa-btn"><span class="qa-icon">\u2699\ufe0f</span><div><div class="qa-label">Show Settings</div><div class="qa-desc">Edit manually</div></div></div>'+
      '<div class="qa-btn"><span class="qa-icon">\ud83d\udce1</span><div><div class="qa-label">Distribute</div><div class="qa-desc">Submit to directories</div></div></div></div></div></div>';
  }

  window._pRestartDemo = restartDemo;
  startFlow();
})();
</script>
